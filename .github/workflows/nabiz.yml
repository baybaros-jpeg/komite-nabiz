name: Nabız

# NEDEN BOYLE YAZILDI (2026-09-20)
#
# Eski surum "*/10 9-18 * * *" ile 10 dakikada bir calisacak sekilde
# ayarlanmisti. GitHub zamanlanmis isleri yogunlukta DUSURUYOR: 27 Agustos
# 2026'dan itibaren gunde beklenen 60 koşu yerine yalnizca 2-4 tanesi
# calisti, yani arka uclar pencere icinde bile 2,5 saat uyudu.
#
# Cozum: GitHub'in kac kez tetikledigine guvenmiyoruz. Tetikleme hangi saatte
# gelirse gelsin, is ICERIDE dongu kurup 10 dakikada bir yokluyor ve pencere
# bitene kadar ayakta kaliyor. Bir tetikleme kacsa bile digeri devralir.
#
#   09-18 UTC = 12:00-21:59 Turkiye saati (gunde 10 saat)
#   Render kotasi: hesap basina ayda 750 ornek-saati.
#   2 arka uc x 10 sa/gun x 30 gun = 600 saat, 150 saat marj kalir.
#   Pencereyi genisletmeden once bu hesabi tekrar yap.
#
# SECIM DONEMI (2026-09-30): 3 Ekim secimi icin 4 Ekim 00:00'a kadar 7/24
# acik. O tarihten sonra betik kendiliginden eski 12:00-22:00 penceresine
# doner (cron her saat dener ama pencere disindaki kosular hemen cikar).
#   Kota: 1-3 Ekim 2x24x3 = 144 sa + 4-31 Ekim 2x10x28 = 560 sa = ~704 sa.
#
# concurrency: ayni anda iki dongu calismasin. Calisan is bitince sirada
# bekleyen devralir, boylece 6 saatlik is siniri pencereyi bolmez.

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nabiz
  cancel-in-progress: false

jobs:
  yokla:
    name: Arka uclari uyanik tut
    runs-on: ubuntu-latest
    # GitHub'in is basina siniri 6 saat; 5 sa 50 dk'da kendimiz cikiyoruz.
    timeout-minutes: 355

    steps:
      - name: Dongu
        run: |
          set -u

          MTP_URL=https://itso-secim-api.onrender.com/api/
          MOG_URL=https://mobilya-oturma-grubu-api.onrender.com/api/

          simdi=$(date +%s)
          tavan=$((simdi + 350 * 60))
          secim_sonu=$(TZ=Europe/Istanbul date -d '2026-10-04 00:00' +%s)

          echo "Baslangic : $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M %Z')"

          if [ "$simdi" -lt "$secim_sonu" ]; then
            # Secim donemi: 7/24. Is 5 sa 50 dk'da cikar, siradaki devralir.
            bitis=$tavan
            [ "$secim_sonu" -lt "$bitis" ] && bitis=$secim_sonu
            echo "Secim donemi: 7/24 acik (4 Ekim 00:00'a kadar)"
          else
            baslangic=$(TZ=Europe/Istanbul date -d 'today 12:00' +%s)
            bitis=$(TZ=Europe/Istanbul date -d 'today 22:00' +%s)
            if [ "$simdi" -lt "$baslangic" ]; then
              echo "Pencere henuz acilmadi (12:00), yapacak bir sey yok."
              exit 0
            fi
          fi
          hedef=$(( bitis < tavan ? bitis : tavan ))
          echo "Bu kosunun sonu: $(TZ=Europe/Istanbul date -d @"$hedef" '+%d.%m %H:%M')"

          if [ "$simdi" -ge "$bitis" ]; then
            echo "Pencere kapali, yapacak bir sey yok."
            exit 0
          fi

          mtp_hata=0
          mog_hata=0

          yokla() {
            ad="$1"; url="$2"
            cikti=$(curl -sS -o /dev/null \
                      -w '%{http_code} %{time_total}' \
                      --max-time 120 "$url" 2>/dev/null || echo "000 0")
            kod="${cikti%% *}"; sure="${cikti##* }"

            if [ "$kod" = "200" ]; then
              uyari=""
              # 5 saniyeden uzun surduyse servis uykudan uyanmis demektir
              case "$sure" in
                [5-9].*|[1-9][0-9].*) uyari="  <- uykudan uyandi" ;;
              esac
              printf '  OK    %-4s %ss%s\n' "$ad" "$sure" "$uyari"
              return 0
            fi
            printf '  HATA  %-4s durum=%s sure=%ss\n' "$ad" "$kod" "$sure"
            return 1
          }

          while :; do
            echo "-- $(TZ=Europe/Istanbul date '+%H:%M')"

            if yokla MTP "$MTP_URL"; then mtp_hata=0; else mtp_hata=$((mtp_hata + 1)); fi
            if yokla MOG "$MOG_URL"; then mog_hata=0; else mog_hata=$((mog_hata + 1)); fi

            # Tek seferlik hata gecici olabilir; ust uste ikisi gercek kesintidir.
            # O anda cikiyoruz ki e-posta gec degil, hemen gelsin. Sirada bekleyen
            # kosu devralip uyanik tutmayi surdurur.
            if [ "$mtp_hata" -ge 2 ] || [ "$mog_hata" -ge 2 ]; then
              echo
              echo "Bir arka uc ust uste iki yoklamada yanit vermedi."
              echo "GitHub bu basarisizligi e-posta ile bildirir."
              exit 1
            fi

            kalan=$((hedef - $(date +%s)))
            if [ "$kalan" -le 60 ]; then
              echo
              echo "Pencere/sure doldu, temiz cikis."
              exit 0
            fi
            [ "$kalan" -lt 600 ] && sleep "$kalan" || sleep 600
          done
